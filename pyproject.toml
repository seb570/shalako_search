[project]
name = "shalako_search"
authors = [{ name = "Shalako Inc", email = "management@shalakoinc.com" }]
description = "Puts matching customers at the top of the ERPNext search bar"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
